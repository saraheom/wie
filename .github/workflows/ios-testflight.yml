name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Optional iOS build number (leave blank to use GitHub run number)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verify Xcode and iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "Developer directory: $(xcode-select -p)"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-apple-ios

      - name: Install Rust build tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack,tauri-cli

      - name: Install frontend dependencies
        run: npm ci

      - name: Force clean Phase 8.22 WIE WebAssembly core
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target/wasm32-unknown-unknown/release
          rm -rf wie_web/pkg wie_web/dist
          grep -n 'PHASE8_9_IPACK_CREATE' wie_wipi_c/src/api/database.rs
          grep -n 'PHASE8_10_ACCESS' wie_ktf/src/runtime/wipi_c/method_table.rs
          grep -n 'PHASE8_11_EXECNAMES' wie_ktf/src/runtime/wipi_c/method_table.rs
          grep -n 'PHASE8_12_INOTIA1_NET' wie_wipi_c/src/api/net.rs
          grep -n 'PHASE8_12_CASH_TX' wie_wipi_c/src/api/net.rs
          grep -n 'PHASE8_13_INOTIA1_NET30' wie_wipi_c/src/api/net.rs
          grep -n 'PHASE8_13_INOTIA2_CERT_BYPASS' wie_ktf/src/runtime/init.rs
          grep -n 'PHASE8_14_INOTIA2_CACHE_CREATE' wie_wipi_c/src/api/database.rs
          grep -n 'PHASE8_14_INOTIA2_CACHE_RESTORE' wie_wipi_c/src/api/database.rs
          grep -n 'PHASE8_14_INOTIA1_INETADDR' wie_wipi_c/src/api/util.rs
          grep -n 'PHASE8_19_INOTIA2_INSTALL_FOOTER' wie_wipi_c/src/api/database.rs
          grep -n 'PHASE8_19_INOTIA2_INSTALLED_FASTPATH' wie_wipi_c/src/api/database.rs
          grep -n 'PHASE8_18_INOTIA2_INSTALL_WRITEBACK' wie_wipi_c/src/api/database.rs
          grep -n 'PHASE8_18_INOTIA1_CASH_INIT_RX' wie_wipi_c/src/api/net.rs
          grep -n 'PHASE8_19_INOTIA1_CASH_REJECT' wie_wipi_c/src/api/net.rs
          grep -n 'PHASE8_19_INOTIA2_RESOURCE_CACHE' wie_ktf/src/runtime/wipi_c/context.rs
          grep -n 'PHASE8_20_INOTIA2_RESOURCE_CACHE_SHARED' wie_ktf/src/runtime/wipi_c.rs
          grep -n 'KtfResourceCache' wie_ktf/src/runtime/wipi_c.rs
          grep -n 'PHASE8_20_INOTIA1_CASH_CMD1_VALIDATION_BYPASS' wie_ktf/src/runtime/init.rs
          grep -n 'PHASE8_20_INOTIA1_CASH_STATE' wie_wipi_c/src/api/net.rs
          grep -n 'PHASE8_21_INOTIA1_CASH_CMD1_DATA_VALIDATION_BYPASS' wie_ktf/src/runtime/init.rs
          grep -n 'PHASE8_21_INOTIA2_DB_CACHE' wie_wipi_c/src/api/database.rs
          grep -n 'host_blob_cache_get' wie_wipi_c/src/context.rs
          grep -n 'PHASE8_22_INOTIA2_EXEC_QUANTUM' wie_ktf/src/emulator.rs
          grep -n 'PHASE8_19_INOTIA2_INSTALLED_FASTPATH' wie_wipi_c/src/api/database.rs
          grep -n 'PHASE8_17_INOTIA2_MEDIA_QUIET' wie_wipi_c/src/api/media.rs
          grep -n 'PHASE8_16_INOTIA1_NET31_TX' wie_wipi_c/src/api/net.rs
          grep -n 'PHASE8_16_INOTIA1_NET32_RX' wie_wipi_c/src/api/net.rs
          grep -n 'socket_read_ktf_legacy.into_body' wie_ktf/src/runtime/wipi_c/method_table.rs
          grep -n 'set_run_slice_instructions(4_000)' wie_ktf/src/emulator.rs
          grep -n 'set_thread_lifecycle_logging(false)' wie_ktf/src/emulator.rs
          grep -n 'PHASE8_22_INOTIA1_CASH_RESPONSE_STATE' wie_wipi_c/src/api/net.rs
          grep -n 'INOTIA1_CASH_SERVER_HELLO: \[u8; 4\] = \[0x00, 0x04, 0x00, 0x01\]' wie_wipi_c/src/api/net.rs
          grep -n 'INOTIA1_CASH_CMD1_SUCCESS: \[u8; 28\]' wie_wipi_c/src/api/net.rs
          grep -n 'PHASE8_22_INOTIA2_INSTALL_UI_SUPPRESS' wie_ktf/src/runtime/init.rs
          grep -n 'codegen-units = 1' Cargo.toml
          grep -n 'wasm-opt = \["-O4"' wie_web/Cargo.toml
          grep -n 'memory_error: Option<u32>' wie_core_arm/src/engine/arm32_cpu.rs
          grep -n 'PHASE8_22_ARM_MEMORY_FASTPATH' wie_core_arm/src/engine/arm32_cpu.rs
          grep -n 'PHASE8_22_RGB565_RAW_IMAGE' wie_wipi_c/src/api/graphics/framebuffer.rs
          grep -n 'PHASE8_22_WEB_RGB565_FASTPAINT' wie_web/src/rust/window.rs
          grep -n 'socket_write_ktf_legacy.into_body' wie_ktf/src/runtime/wipi_c/method_table.rs
          grep -n 'consecutive_count_exhausted == 16384' wie_core_arm/src/core.rs
          grep -n 'util::inet_addr_int.into_body' wie_ktf/src/runtime/wipi_c/method_table.rs
          grep -n 'ByteRead, ByteWrite' wie_ktf/src/runtime/init.rs
          if grep -q 'PHASE8_17_INOTIA2_INSTALL_CALL_BYPASS' wie_ktf/src/runtime/init.rs; then
            echo 'Unsafe Phase 8.17 Inotia2 install-call bypass is still present' >&2
            exit 1
          fi
          if grep -q 'PHASE8_17_INOTIA1_CASH_CMD0_BOOTSTRAP' wie_ktf/src/runtime/init.rs; then
            echo 'Obsolete Phase 8.17 Inotia1 forced command-0 branch is still present' >&2
            exit 1
          fi
          if grep -q 'set_run_slice_instructions(16_000)' wie_ktf/src/emulator.rs; then
            echo 'Obsolete Phase 8.21 16k Inotia2 execution slice is still present' >&2
            exit 1
          fi
          if grep -q 'PHASE8_16_INOTIA2_PERF_PROFILE' wie_wipi_c/src/api/database.rs; then
            echo 'Obsolete forced Inotia2 graphics-off profile is still present' >&2
            exit 1
          fi
          grep -n 'get_access_level_compat_impl.into_body' wie_ktf/src/runtime/wipi_c/method_table.rs
          grep -n 'get_exec_names_compat_impl.into_body' wie_ktf/src/runtime/wipi_c/method_table.rs

      - name: Build WIE WebAssembly frontend
        run: npm run build:prod

      - name: Verify Phase 8.22 core source was selected
        shell: bash
        run: |
          set -euo pipefail
          grep -n 'PHASE8_9_IPACK_CREATE' wie_wipi_c/src/api/database.rs
          grep -n 'PHASE8_10_ACCESS' wie_ktf/src/runtime/wipi_c/method_table.rs
          grep -n 'PHASE8_11_EXECNAMES' wie_ktf/src/runtime/wipi_c/method_table.rs
          grep -n 'PHASE8_12_INOTIA1_NET' wie_wipi_c/src/api/net.rs
          grep -n 'PHASE8_12_CASH_TX' wie_wipi_c/src/api/net.rs
          grep -n 'PHASE8_13_INOTIA1_NET30' wie_wipi_c/src/api/net.rs
          grep -n 'PHASE8_13_INOTIA2_CERT_BYPASS' wie_ktf/src/runtime/init.rs
          grep -n 'PHASE8_14_INOTIA2_CACHE_CREATE' wie_wipi_c/src/api/database.rs
          grep -n 'PHASE8_14_INOTIA2_CACHE_RESTORE' wie_wipi_c/src/api/database.rs
          grep -n 'PHASE8_14_INOTIA1_INETADDR' wie_wipi_c/src/api/util.rs
          grep -n 'PHASE8_19_INOTIA2_INSTALL_FOOTER' wie_wipi_c/src/api/database.rs
          grep -n 'PHASE8_19_INOTIA2_INSTALLED_FASTPATH' wie_wipi_c/src/api/database.rs
          grep -n 'PHASE8_18_INOTIA2_INSTALL_WRITEBACK' wie_wipi_c/src/api/database.rs
          grep -n 'PHASE8_18_INOTIA1_CASH_INIT_RX' wie_wipi_c/src/api/net.rs
          grep -n 'PHASE8_19_INOTIA1_CASH_REJECT' wie_wipi_c/src/api/net.rs
          grep -n 'PHASE8_19_INOTIA2_RESOURCE_CACHE' wie_ktf/src/runtime/wipi_c/context.rs
          grep -n 'PHASE8_20_INOTIA2_RESOURCE_CACHE_SHARED' wie_ktf/src/runtime/wipi_c.rs
          grep -n 'KtfResourceCache' wie_ktf/src/runtime/wipi_c.rs
          grep -n 'PHASE8_20_INOTIA1_CASH_CMD1_VALIDATION_BYPASS' wie_ktf/src/runtime/init.rs
          grep -n 'PHASE8_20_INOTIA1_CASH_STATE' wie_wipi_c/src/api/net.rs
          grep -n 'PHASE8_21_INOTIA1_CASH_CMD1_DATA_VALIDATION_BYPASS' wie_ktf/src/runtime/init.rs
          grep -n 'PHASE8_21_INOTIA2_DB_CACHE' wie_wipi_c/src/api/database.rs
          grep -n 'host_blob_cache_get' wie_wipi_c/src/context.rs
          grep -n 'PHASE8_22_INOTIA2_EXEC_QUANTUM' wie_ktf/src/emulator.rs
          grep -n 'PHASE8_19_INOTIA2_INSTALLED_FASTPATH' wie_wipi_c/src/api/database.rs
          grep -n 'PHASE8_17_INOTIA2_MEDIA_QUIET' wie_wipi_c/src/api/media.rs
          grep -n 'PHASE8_16_INOTIA1_NET31_TX' wie_wipi_c/src/api/net.rs
          grep -n 'PHASE8_16_INOTIA1_NET32_RX' wie_wipi_c/src/api/net.rs
          grep -n 'socket_read_ktf_legacy.into_body' wie_ktf/src/runtime/wipi_c/method_table.rs
          grep -n 'set_run_slice_instructions(4_000)' wie_ktf/src/emulator.rs
          grep -n 'set_thread_lifecycle_logging(false)' wie_ktf/src/emulator.rs
          grep -n 'PHASE8_22_INOTIA1_CASH_RESPONSE_STATE' wie_wipi_c/src/api/net.rs
          grep -n 'INOTIA1_CASH_SERVER_HELLO: \[u8; 4\] = \[0x00, 0x04, 0x00, 0x01\]' wie_wipi_c/src/api/net.rs
          grep -n 'INOTIA1_CASH_CMD1_SUCCESS: \[u8; 28\]' wie_wipi_c/src/api/net.rs
          grep -n 'PHASE8_22_INOTIA2_INSTALL_UI_SUPPRESS' wie_ktf/src/runtime/init.rs
          grep -n 'codegen-units = 1' Cargo.toml
          grep -n 'wasm-opt = \["-O4"' wie_web/Cargo.toml
          grep -n 'memory_error: Option<u32>' wie_core_arm/src/engine/arm32_cpu.rs
          grep -n 'PHASE8_22_ARM_MEMORY_FASTPATH' wie_core_arm/src/engine/arm32_cpu.rs
          grep -n 'PHASE8_22_RGB565_RAW_IMAGE' wie_wipi_c/src/api/graphics/framebuffer.rs
          grep -n 'PHASE8_22_WEB_RGB565_FASTPAINT' wie_web/src/rust/window.rs
          grep -n 'socket_write_ktf_legacy.into_body' wie_ktf/src/runtime/wipi_c/method_table.rs
          grep -n 'consecutive_count_exhausted == 16384' wie_core_arm/src/core.rs
          grep -n 'util::inet_addr_int.into_body' wie_ktf/src/runtime/wipi_c/method_table.rs
          grep -n 'ByteRead, ByteWrite' wie_ktf/src/runtime/init.rs
          if grep -q 'PHASE8_17_INOTIA2_INSTALL_CALL_BYPASS' wie_ktf/src/runtime/init.rs; then
            echo 'Unsafe Phase 8.17 Inotia2 install-call bypass is still present' >&2
            exit 1
          fi
          if grep -q 'PHASE8_17_INOTIA1_CASH_CMD0_BOOTSTRAP' wie_ktf/src/runtime/init.rs; then
            echo 'Obsolete Phase 8.17 Inotia1 forced command-0 branch is still present' >&2
            exit 1
          fi
          if grep -q 'set_run_slice_instructions(16_000)' wie_ktf/src/emulator.rs; then
            echo 'Obsolete Phase 8.21 16k Inotia2 execution slice is still present' >&2
            exit 1
          fi
          if grep -q 'PHASE8_16_INOTIA2_PERF_PROFILE' wie_wipi_c/src/api/database.rs; then
            echo 'Obsolete forced Inotia2 graphics-off profile is still present' >&2
            exit 1
          fi
          grep -n 'net::socket_connect.into_body' wie_ktf/src/runtime/wipi_c/method_table.rs
          grep -n 'net::set_read_cb.into_body' wie_ktf/src/runtime/wipi_c/method_table.rs
          grep -n 'net::socket_connect_ktf_legacy.into_body' wie_ktf/src/runtime/wipi_c/method_table.rs
          if grep -q 'PHASE8_15_INOTIA2_INSTALL_SKIP' wie_wipi_c/src/api/database.rs; then echo 'obsolete Phase 8.15 appinfo install override still present' >&2; exit 1; fi
          if grep -q 'PHASE8_15_INOTIA1_NET32' wie_wipi_c/src/api/net.rs; then echo 'obsolete Phase 8.15 slot32 writer still present' >&2; exit 1; fi
          if grep -q 'PHASE8_12_TCERT_ALIAS' wie_wipi_c/src/api/database.rs; then echo 'obsolete Phase 8.12 tcert alias still present' >&2; exit 1; fi
          test -f wie_web/pkg/wie_web_bg.wasm
          grep -n 'INOTIA2_KTF_REQUIRED_ACCESS_MASK: WIPICWord = 0xBC' wie_ktf/src/runtime/wipi_c/method_table.rs
          grep -n '010100D5/010100D5.jar' wie_ktf/src/runtime/wipi_c/method_table.rs
          if grep -q 'PHASE8_16_INOTIA2_INSTALL_VERIFY_BYPASS' wie_ktf/src/runtime/init.rs; then echo 'obsolete Phase 8.16 install verifier patch still present' >&2; exit 1; fi
          echo 'Phase 8.22 clean WASM build completed.'

      - name: Install Apple project tools
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"

          if ! command -v xcodegen >/dev/null 2>&1; then
            arch -arm64 brew install xcodegen
          fi

          if ! command -v idevice_id >/dev/null 2>&1; then
            arch -arm64 brew install libimobiledevice
          fi

          xcodegen --version
          pod --version
          idevice_id --version || true

      - name: Validate TestFlight secrets
        shell: bash
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail

          missing=0
          for name in \
            APPLE_DEVELOPMENT_TEAM \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER \
            APPLE_API_PRIVATE_KEY_BASE64
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Install App Store Connect API key
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail

          KEY_DIR="$RUNNER_TEMP/appstoreconnect"
          mkdir -p "$KEY_DIR"

          KEY_PATH="$KEY_DIR/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          # Tauri automatic-signing variables.
          echo "APPLE_API_KEY=${APPLE_API_KEY_ID}" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=${KEY_PATH}" >> "$GITHUB_ENV"

          # altool also searches this conventional directory.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"

          echo "Installed App Store Connect API key."

      - name: Generate the Tauri Apple project
        working-directory: wie_app
        shell: bash
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        run: |
          set -euo pipefail
          cargo tauri ios init --ci

      - name: Verify generated bundle identifier
        working-directory: wie_app/gen/apple
        shell: bash
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail

          echo "Expected bundle ID: com.jjunnyy.wieplayer"
          grep -R "com.jjunnyy.wieplayer" . || {
            echo "::error::Generated Apple project does not contain com.jjunnyy.wieplayer"
            exit 1
          }

          echo "Generated signing-related settings:"
          grep -R -n -E 'DEVELOPMENT_TEAM|CODE_SIGN_STYLE|PRODUCT_BUNDLE_IDENTIFIER' \
            wie_app.xcodeproj/project.pbxproj || true

      - name: Resolve build number
        id: build_number
        shell: bash
        env:
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail

          if [[ -n "${REQUESTED_BUILD_NUMBER:-}" ]]; then
            number="$REQUESTED_BUILD_NUMBER"
          else
            number="${GITHUB_RUN_NUMBER}"
          fi

          if [[ ! "$number" =~ ^[0-9]+$ ]]; then
            echo "::error::Build number must contain digits only."
            exit 1
          fi

          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "Using iOS build number: $number"

      - name: Build App Store Connect IPA with automatic signing
        working-directory: wie_app
        shell: bash
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          RUST_BACKTRACE: "1"
        run: |
          set -euo pipefail

          # IMPORTANT:
          # Do not expose IOS_CERTIFICATE / IOS_MOBILE_PROVISION here.
          # Tauri currently has a known manual-provisioning bug on recent Xcode.
          # API-key automatic signing is the supported CI path.
          cargo tauri ios build \
            --target aarch64 \
            --ci \
            --export-method app-store-connect \
            --build-number "${{ steps.build_number.outputs.number }}" \
            --config '{"build":{"beforeBuildCommand":""}}'

      - name: Locate IPA
        id: ipa
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for generated IPA..."
          find wie_app/gen/apple -type f -name '*.ipa' -print || true

          ipa_path="$(find wie_app/gen/apple -type f -name '*.ipa' -print -quit)"

          if [[ -z "$ipa_path" ]]; then
            echo "::error::No IPA was produced."
            find wie_app/gen/apple -maxdepth 10 -type f -print || true
            exit 1
          fi

          mkdir -p dist
          cp "$ipa_path" "dist/WIPI-Player-iOS-TestFlight.ipa"

          echo "path=dist/WIPI-Player-iOS-TestFlight.ipa" >> "$GITHUB_OUTPUT"
          echo "IPA: $ipa_path"
          shasum -a 256 "dist/WIPI-Player-iOS-TestFlight.ipa"

      - name: Upload IPA as GitHub artifact
        uses: actions/upload-artifact@v7
        with:
          name: WIPI-Player-iOS-TestFlight
          path: dist/WIPI-Player-iOS-TestFlight.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to App Store Connect
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail

          xcrun altool \
            --upload-app \
            --type ios \
            --file "dist/WIPI-Player-iOS-TestFlight.ipa" \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER"

      - name: Upload generated Apple project on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: WIPI-Player-iOS-TestFlight-Diagnostics
          path: wie_app/gen/apple
          if-no-files-found: ignore
          retention-days: 7
