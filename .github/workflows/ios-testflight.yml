          if grep -q 'INOTIA1_CASH_CMD30_REENTRY_EMPTY' wie_wipi_c/src/api/net.rs; then
            echo 'Obsolete Phase 8.24 zero-record Inotia1 command-30 catalog is still present' >&2
            exit 1
          fi
          if grep -q 'PHASE8_17_INOTIA2_INSTALL_CALL_BYPASS' wie_ktf/src/runtime/init.rs; then
            echo 'Unsafe Phase 8.17 Inotia2 install-call bypass is still present' >&2
            exit 1
          fi
          if grep -q 'PHASE8_17_INOTIA1_CASH_CMD0_BOOTSTRAP' wie_ktf/src/runtime/init.rs; then
            echo 'Obsolete Phase 8.17 Inotia1 forced command-0 branch is still present' >&2
            exit 1
          fi
          if grep -q 'set_run_slice_instructions(16_000)' wie_ktf/src/emulator.rs; then
            echo 'Obsolete Phase 8.21 16k Inotia2 execution slice is still present' >&2
            exit 1
          fi
          if grep -q 'PHASE8_23_INOTIA2_FRAME_STALL' wie_wipi_c/src/api/graphics.rs; then
            echo 'Phase 8.23 per-frame stall profiler is still present in the graphics hot path' >&2
            exit 1
          fi
          if grep -q 'PHASE8_23_INOTIA2_PRESENT_COST' wie_wipi_c/src/api/graphics.rs; then
            echo 'Phase 8.23 present-cost profiler is still present in the graphics hot path' >&2
            exit 1
          fi
          if grep -q 'set_native_loop_trace_chunks(1_024)' wie_ktf/src/emulator.rs; then
            echo 'Phase 8.23 low native-loop diagnostic threshold is still active' >&2
            exit 1
          fi
          if grep -q 'PHASE8_16_INOTIA2_PERF_PROFILE' wie_wipi_c/src/api/database.rs; then
            echo 'Obsolete forced Inotia2 graphics-off profile is still present' >&2
            exit 1
          fi
          if grep -q 'PHASE8_25_INOTIA2_RGB565_FASTPATH' wie_ktf/src/runtime/init.rs; then
            echo 'Obsolete Phase 8.25 one-row RGB565 handler is still present' >&2
            exit 1
          fi
          grep -n 'net::socket_connect.into_body' wie_ktf/src/runtime/wipi_c/method_table.rs
          grep -n 'net::set_read_cb.into_body' wie_ktf/src/runtime/wipi_c/method_table.rs
          grep -n 'net::socket_connect_ktf_legacy.into_body' wie_ktf/src/runtime/wipi_c/method_table.rs
          if grep -q 'PHASE8_15_INOTIA2_INSTALL_SKIP' wie_wipi_c/src/api/database.rs; then echo 'obsolete Phase 8.15 appinfo install override still present' >&2; exit 1; fi
          if grep -q 'PHASE8_15_INOTIA1_NET32' wie_wipi_c/src/api/net.rs; then echo 'obsolete Phase 8.15 slot32 writer still present' >&2; exit 1; fi
          if grep -q 'PHASE8_12_TCERT_ALIAS' wie_wipi_c/src/api/database.rs; then echo 'obsolete Phase 8.12 tcert alias still present' >&2; exit 1; fi
          test -f wie_web/pkg/wie_web_bg.wasm
          grep -n 'INOTIA2_KTF_REQUIRED_ACCESS_MASK: WIPICWord = 0xBC' wie_ktf/src/runtime/wipi_c/method_table.rs
          grep -n '010100D5/010100D5.jar' wie_ktf/src/runtime/wipi_c/method_table.rs
          if grep -q 'PHASE8_16_INOTIA2_INSTALL_VERIFY_BYPASS' wie_ktf/src/runtime/init.rs; then echo 'obsolete Phase 8.16 install verifier patch still present' >&2; exit 1; fi
          echo 'Phase 8.60 clean WASM build completed.'


      - name: Verify Phase 8.60 web runtime and build marker
        id: phase854_web
        shell: bash
        run: |
          set -euo pipefail

          RAW_WASM="wie_web/pkg/wie_web_bg.wasm"
          test -f "$RAW_WASM"
          grep -a -q 'PHASE8_60_RUNTIME_SENTINEL' "$RAW_WASM"
          grep -a -q 'PHASE8_60_WEC_OEM_APP_EXECUTOR' "$RAW_WASM"
          grep -a -q 'PHASE8_60_LGT_INTERFACE_LINK' "$RAW_WASM"
          grep -a -q 'PHASE8_60_LGT_WIDE_FIELD_CONTINUATION' "$RAW_WASM"
          grep -a -q 'PHASE8_60_LGT_CLASS_INIT_REENTRANT' "$RAW_WASM"
          grep -a -q 'PHASE8_61_LGT_IS_ASSIGNABLE_ENTRY' "$RAW_WASM"
          grep -a -q 'PHASE8_61_LGT_THROW_EXCEPTION' "$RAW_WASM"
          grep -a -q 'PHASE8_65_OZ_FIND_RESOURCE_PROBE' "$RAW_WASM"
          grep -a -q 'PHASE8_71_OZ_FIND_RESOURCE_ENTRY' "$RAW_WASM"
          grep -a -q 'PHASE8_71_OZ_URL_GET_FILE_RETURN' "$RAW_WASM"
          grep -a -q 'PHASE8_71_OZ_METADATA_SIZE_BEGIN' "$RAW_WASM"
          grep -a -q 'PHASE8_73_OZ_METADATA_CACHE_HIT' "$RAW_WASM"
          grep -a -q 'PHASE8_73_OZ_METADATA_NEGATIVE_CACHE_HIT' "$RAW_WASM"
          grep -a -q 'PHASE8_73_OZ_METADATA_NEGATIVE_CACHE_STORE' "$RAW_WASM"
          grep -a -q 'PHASE8_73_OZ_METADATA_CACHE_STORE' "$RAW_WASM"
          grep -a -q 'PHASE8_74_OZ_FILE_READ_ACCUM_BEGIN' "$RAW_WASM"
          grep -a -q 'PHASE8_74_OZ_FILE_READ_ACCUM_RETURN' "$RAW_WASM"
          grep -a -q 'PHASE8_60_LGT_LINK_CLASS_BEGIN' "$RAW_WASM"
          grep -a -q 'PHASE8_60_LGT_VTABLE_HIERARCHY_BEGIN' "$RAW_WASM"
          grep -a -q 'PHASE8_60_WIPI_INPUT_METHOD_MODE' "$RAW_WASM"
          grep -a -q 'PHASE8_60_LGT_STARTUP_ERROR' "$RAW_WASM"
          grep -a -q 'PHASE8_60_LGT_AOT_METHOD_FAULT' "$RAW_WASM"
          grep -a -q 'PHASE8_60_ARM_SVC_FAULT' "$RAW_WASM"
          grep -a -q 'PHASE8_60_INOTIA1_REWARD_REPAIR_ACTIVE' "$RAW_WASM"
          grep -a -q 'PHASE8_60_INOTIA1_REWARD_OVERFLOW_REPAIR' "$RAW_WASM"
          if grep -a -q 'PHASE8_49_INOTIA1_REWARD_WIDE_MATH' "$RAW_WASM"; then
            echo '::error::Raw WASM still contains noisy Phase 8.49 per-spawn reward logging.'
            exit 1
          fi

          BUNDLED_WASM="$(find wie_web/dist -type f -name '*.wasm' -print -quit)"
          if [[ -z "$BUNDLED_WASM" ]]; then
            echo '::error::Webpack did not emit a WebAssembly asset into wie_web/dist.'
            find wie_web/dist -maxdepth 3 -type f -print || true
            exit 1
          fi
          grep -a -q 'PHASE8_60_RUNTIME_SENTINEL' "$BUNDLED_WASM" || { echo '::error::Bundled WASM missing Phase 8.60 runtime sentinel.'; exit 1; }
          grep -a -q 'PHASE8_60_WEC_OEM_APP_EXECUTOR' "$BUNDLED_WASM" || { echo '::error::Bundled WASM missing WEC OEMAppExecutor marker.'; exit 1; }
          grep -a -q 'PHASE8_60_LGT_INTERFACE_LINK' "$BUNDLED_WASM" || { echo '::error::Bundled WASM missing LGT interface-link marker.'; exit 1; }
          grep -a -q 'PHASE8_60_LGT_WIDE_FIELD_CONTINUATION' "$BUNDLED_WASM" || { echo '::error::Bundled WASM missing LGT wide-field continuation marker.'; exit 1; }
          grep -a -q 'PHASE8_60_LGT_CLASS_INIT_REENTRANT' "$BUNDLED_WASM" || { echo '::error::Bundled WASM missing LGT class-init re-entrancy marker.'; exit 1; }
          grep -a -q 'PHASE8_61_LGT_IS_ASSIGNABLE_ENTRY' "$BUNDLED_WASM" || { echo '::error::Bundled WASM missing Phase 8.61 LGT assignability marker.'; exit 1; }
          grep -a -q 'PHASE8_61_LGT_THROW_EXCEPTION' "$BUNDLED_WASM" || { echo '::error::Bundled WASM missing Phase 8.61 LGT throw marker.'; exit 1; }
          grep -a -q 'PHASE8_65_OZ_FIND_RESOURCE_PROBE' "$BUNDLED_WASM" || { echo '::error::Bundled WASM missing Phase 8.65 OZ Java dispatch marker.'; exit 1; }
          grep -a -q 'PHASE8_71_OZ_FIND_RESOURCE_ENTRY' "$BUNDLED_WASM" || { echo '::error::Bundled WASM missing Phase 8.71 OZ Java-call marker.'; exit 1; }
          grep -a -q 'PHASE8_71_OZ_URL_GET_FILE_RETURN' "$BUNDLED_WASM" || { echo '::error::Bundled WASM missing Phase 8.71 OZ URL.getFile return marker.'; exit 1; }
          grep -a -q 'PHASE8_71_OZ_METADATA_SIZE_BEGIN' "$BUNDLED_WASM" || { echo '::error::Bundled WASM missing Phase 8.71 metadata-size marker.'; exit 1; }
          grep -a -q 'PHASE8_73_OZ_METADATA_CACHE_HIT' "$BUNDLED_WASM" || { echo '::error::Bundled WASM missing Phase 8.73 metadata-cache hit marker.'; exit 1; }
          grep -a -q 'PHASE8_73_OZ_METADATA_NEGATIVE_CACHE_HIT' "$BUNDLED_WASM" || { echo '::error::Bundled WASM missing Phase 8.73 negative-cache hit marker.'; exit 1; }
          grep -a -q 'PHASE8_73_OZ_METADATA_NEGATIVE_CACHE_STORE' "$BUNDLED_WASM" || { echo '::error::Bundled WASM missing Phase 8.73 negative-cache store marker.'; exit 1; }
          grep -a -q 'PHASE8_73_OZ_METADATA_CACHE_STORE' "$BUNDLED_WASM" || { echo '::error::Bundled WASM missing Phase 8.73 metadata-cache store marker.'; exit 1; }
          grep -a -q 'PHASE8_74_OZ_FILE_READ_ACCUM_BEGIN' "$BUNDLED_WASM" || { echo '::error::Bundled WASM missing Phase 8.74 accumulated-read begin marker.'; exit 1; }
          grep -a -q 'PHASE8_74_OZ_FILE_READ_ACCUM_RETURN' "$BUNDLED_WASM" || { echo '::error::Bundled WASM missing Phase 8.74 accumulated-read return marker.'; exit 1; }
          grep -a -q 'PHASE8_60_LGT_LINK_CLASS_BEGIN' "$BUNDLED_WASM" || { echo '::error::Bundled WASM missing LGT class-link localization marker.'; exit 1; }
          grep -a -q 'PHASE8_60_LGT_VTABLE_HIERARCHY_BEGIN' "$BUNDLED_WASM" || { echo '::error::Bundled WASM missing LGT vtable localization marker.'; exit 1; }
          grep -a -q 'PHASE8_60_WIPI_INPUT_METHOD_MODE' "$BUNDLED_WASM" || { echo '::error::Bundled WASM missing WIPI input-method marker.'; exit 1; }
          grep -a -q 'PHASE8_60_LGT_STARTUP_ERROR' "$BUNDLED_WASM" || { echo '::error::Bundled WASM missing LGT startup-error marker.'; exit 1; }
          grep -a -q 'PHASE8_60_LGT_AOT_METHOD_FAULT' "$BUNDLED_WASM" || { echo '::error::Bundled WASM missing LGT AOT fault marker.'; exit 1; }
          grep -a -q 'PHASE8_60_ARM_SVC_FAULT' "$BUNDLED_WASM" || { echo '::error::Bundled WASM missing ARM SVC fault marker.'; exit 1; }
          grep -a -q 'PHASE8_68_OZ_RUNTIME_OPEN_ENTRY' "$BUNDLED_WASM" || { echo '::error::Bundled WASM missing Phase 8.68 OZ RandomAccessFile/VFS marker.'; exit 1; }
          grep -a -q 'PHASE8_60_INOTIA1_REWARD_REPAIR_ACTIVE' "$BUNDLED_WASM" || { echo '::error::Bundled WASM missing reward-repair active marker.'; exit 1; }
          grep -a -q 'PHASE8_60_INOTIA1_REWARD_OVERFLOW_REPAIR' "$BUNDLED_WASM" || { echo '::error::Bundled WASM missing overflow-repair marker.'; exit 1; }
          if grep -a -q 'PHASE8_49_INOTIA1_REWARD_WIDE_MATH' "$BUNDLED_WASM"; then
            echo '::error::Bundled WASM still contains noisy Phase 8.49 per-spawn reward logging.'
            exit 1
          fi

          BUILD_MARKER="wie_web/dist/phase8_74_build.txt"
          if [[ ! -f "$BUILD_MARKER" ]]; then
            echo '::error::Phase 8.73 frontend build marker was not copied into wie_web/dist.'
            find wie_web/dist -maxdepth 2 -type f -print || true
            exit 1
          fi
          grep -Fxq 'PHASE8_74_BUILD_SENTINEL=WIPI_PLAYER_0.1.74_OZ_16K_ACCUMULATED_VFS_READ_FIX' "$BUILD_MARKER"

          MARKER_SHA256="$(shasum -a 256 "$BUILD_MARKER" | awk '{print $1}')"
          echo "marker_sha256=$MARKER_SHA256" >> "$GITHUB_OUTPUT"
          echo "Bundled WASM: $BUNDLED_WASM"
          echo "Build marker SHA-256: $MARKER_SHA256"
          echo 'Verified Phase 8.73 OZ JAR metadata cache fix and frontend build marker.'

      - name: Install Apple project tools
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"

          if ! command -v xcodegen >/dev/null 2>&1; then
            arch -arm64 brew install xcodegen
          fi

          if ! command -v idevice_id >/dev/null 2>&1; then
            arch -arm64 brew install libimobiledevice
          fi

          xcodegen --version
          pod --version
          idevice_id --version || true

      - name: Validate TestFlight secrets
        shell: bash
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail

          missing=0
          for name in \
            APPLE_DEVELOPMENT_TEAM \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER \
            APPLE_API_PRIVATE_KEY_BASE64
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Install App Store Connect API key
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail

          KEY_DIR="$RUNNER_TEMP/appstoreconnect"
          mkdir -p "$KEY_DIR"

          KEY_PATH="$KEY_DIR/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          # Tauri automatic-signing variables.
          echo "APPLE_API_KEY=${APPLE_API_KEY_ID}" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=${KEY_PATH}" >> "$GITHUB_ENV"

          # altool also searches this conventional directory.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"

          echo "Installed App Store Connect API key."

      - name: Generate the Tauri Apple project
        working-directory: wie_app
        shell: bash
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        run: |
          set -euo pipefail
          rm -rf gen/apple
          cargo tauri ios init --ci

      - name: Verify generated bundle identifier
        working-directory: wie_app/gen/apple
        shell: bash
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail

          echo "Expected bundle ID: com.jjunnyy.wieplayer"
          grep -R "com.jjunnyy.wieplayer" . || {
            echo "::error::Generated Apple project does not contain com.jjunnyy.wieplayer"
            exit 1
          }

          echo "Generated signing-related settings:"
          grep -R -n -E 'DEVELOPMENT_TEAM|CODE_SIGN_STYLE|PRODUCT_BUNDLE_IDENTIFIER' \
            wie_app.xcodeproj/project.pbxproj || true

      - name: Resolve build number
        id: build_number
        shell: bash
        env:
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail

          if [[ -n "${REQUESTED_BUILD_NUMBER:-}" ]]; then
            number="$REQUESTED_BUILD_NUMBER"
          else
            number="${GITHUB_RUN_NUMBER}"
          fi

          if [[ ! "$number" =~ ^[0-9]+$ ]]; then
            echo "::error::Build number must contain digits only."
            exit 1
          fi

          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "Using iOS build number: $number"

      - name: Build App Store Connect IPA with automatic signing
        working-directory: wie_app
        shell: bash
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          RUST_BACKTRACE: "1"
        run: |
          set -euo pipefail

          # IMPORTANT:
          # Do not expose IOS_CERTIFICATE / IOS_MOBILE_PROVISION here.
          # Tauri currently has a known manual-provisioning bug on recent Xcode.
          # API-key automatic signing is the supported CI path.
          cargo tauri ios build \
            --target aarch64 \
            --ci \
            --export-method app-store-connect \
            --build-number "${{ steps.build_number.outputs.number }}" \
            --config '{"build":{"beforeBuildCommand":""}}'

      - name: Locate IPA
        id: ipa
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for generated IPA..."
          find wie_app/gen/apple -type f -name '*.ipa' -print || true

          ipa_path="$(find wie_app/gen/apple -type f -name '*.ipa' -print -quit)"

          if [[ -z "$ipa_path" ]]; then
            echo "::error::No IPA was produced."
            find wie_app/gen/apple -maxdepth 10 -type f -print || true
            exit 1
          fi

          mkdir -p dist
          cp "$ipa_path" "dist/WIPI-Player-iOS-TestFlight.ipa"

          echo "path=dist/WIPI-Player-iOS-TestFlight.ipa" >> "$GITHUB_OUTPUT"
          echo "IPA: $ipa_path"
          shasum -a 256 "dist/WIPI-Player-iOS-TestFlight.ipa"

      - name: Verify Phase 8.60 package identity inside final IPA
        shell: bash
        run: |
          set -euo pipefail

          VERIFY_DIR="$RUNNER_TEMP/phase850-ipa"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          unzip -q "dist/WIPI-Player-iOS-TestFlight.ipa" -d "$VERIFY_DIR"

          APP_DIR="$(find "$VERIFY_DIR/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$APP_DIR" ]]; then
            echo '::error::Unable to locate .app bundle inside final IPA.'
            exit 1
          fi

          APP_PLIST="$APP_DIR/Info.plist"
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PLIST")"
          APP_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PLIST")"
          APP_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PLIST")"
          EXPECTED_BUILD="${{ steps.build_number.outputs.number }}"
          EXPECTED_TAURI_BUILD="$APP_VERSION.$EXPECTED_BUILD"

          if [[ "$APP_VERSION" != "0.1.74" ]]; then
            echo "::error::Final IPA marketing version is $APP_VERSION, expected 0.1.74."
            exit 1
          fi
          # Tauri 2 iOS composes CFBundleVersion as <marketing-version>.<build-number>
          # (for example 0.1.74.85), rather than the bare numeric build number.
          # Accept the composed form used by the current toolchain, while retaining
          # compatibility with a future Tauri release that may emit the bare number.
          if [[ "$APP_BUILD" != "$EXPECTED_TAURI_BUILD" && "$APP_BUILD" != "$EXPECTED_BUILD" ]]; then
            echo "::error::Final IPA build number is $APP_BUILD; expected $EXPECTED_TAURI_BUILD (or bare $EXPECTED_BUILD)."
            exit 1
          fi
          if [[ "$APP_BUNDLE_ID" != "com.jjunnyy.wieplayer" ]]; then
            echo "::error::Final IPA bundle identifier is $APP_BUNDLE_ID, expected com.jjunnyy.wieplayer."
            exit 1
          fi

          echo "Verified final IPA identity: bundle=$APP_BUNDLE_ID version=$APP_VERSION build=$APP_BUILD"
          echo 'Phase 8.60 runtime was already verified in the clean raw and webpack-emitted WASM before the fresh Tauri iOS build.'

      - name: Upload IPA as GitHub artifact
        uses: actions/upload-artifact@v7
        with:
          name: WIPI-Player-Phase8.51-iOS-TestFlight
          path: dist/WIPI-Player-iOS-TestFlight.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to App Store Connect
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail

          xcrun altool \
            --upload-app \
            --type ios \
            --file "dist/WIPI-Player-iOS-TestFlight.ipa" \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER"

      - name: Upload generated Apple project on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: WIPI-Player-iOS-TestFlight-Diagnostics
          path: wie_app/gen/apple
          if-no-files-found: ignore
          retention-days: 7
