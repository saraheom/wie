          grep -n 'PHASE8_30_INOTIA2_STARTUP_MENU_PROBE' wie_ktf/src/emulator.rs
          grep -n 'set_native_loop_trace_chunks(2_048)' wie_ktf/src/emulator.rs
          grep -n 'INOTIA1_NETWORK_ITEM_USE_BRANCH: u32 = 0x0015_032e' wie_ktf/src/runtime/init.rs
          grep -n 'PHASE8_28_INOTIA2_RGB565_BATCH' wie_ktf/src/runtime/init.rs
          grep -n 'INOTIA2_RGB565_EFFECT_EPILOGUE_PC: u32 = 0x0012_3d4b' wie_ktf/src/runtime/init.rs
