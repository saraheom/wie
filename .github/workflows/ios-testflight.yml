          grep -n 'PHASE8_40_INOTIA1_WIPE_CASH_CANCEL_RECOVERY' wie_wipi_c/src/api/net.rs
          grep -n 'state == 14' wie_wipi_c/src/api/net.rs
          grep -n 'write_inotia1_got_u32(context, r10, 0x25c, 11)' wie_wipi_c/src/api/net.rs
          grep -n 'write_inotia1_got_u32(context, r10, 0x5f8, 0)' wie_wipi_c/src/api/net.rs
          grep -n 'PHASE8_44_RUNTIME_SENTINEL' wie_ktf/src/emulator.rs
          grep -n 'PHASE8_44_INOTIA1_EXP_TRACE_ARMED' wie_ktf/src/emulator.rs
          grep -n 'set_inotia1_exp_diagnostics(true)' wie_ktf/src/emulator.rs
          grep -n 'PHASE8_44_INOTIA1_EXP_CANDIDATE' wie_core_arm/src/engine/arm32_cpu.rs
          grep -n 'PHASE8_44_INOTIA1_OBJECT_HEAD' wie_core_arm/src/engine/arm32_cpu.rs
          grep -n 'const INOTIA1_EXP_DIAG_EVENT_LIMIT: u32 = 480' wie_core_arm/src/engine/arm32_cpu.rs
          grep -n 'consider_inotia1_exp_candidate(addr, old as u32, val as u32, 16)' wie_core_arm/src/engine/arm32_cpu.rs
          grep -n 'consider_inotia1_exp_candidate(addr, old, val, 32)' wie_core_arm/src/engine/arm32_cpu.rs
          grep -n 'width={}' wie_core_arm/src/engine/arm32_cpu.rs
          if grep -q 'MIN_SIGNAL_VALUE' wie_core_arm/src/engine/arm32_cpu.rs; then echo 'Obsolete Phase 8.43 >=4096 EXP floor is still present' >&2; exit 1; fi
          grep -n 'Phase 8.42: only save-slot reads retain INFO diagnostics' wie_wipi_c/src/api/database.rs
          grep -n '\[INOTIA1_SAVE_READ\]' wie_wipi_c/src/api/database.rs
          grep -n '\[INOTIA1_SAVE_COMMIT\]' wie_wipi_c/src/api/database.rs
          if grep -Fq 'tracing::info!("[PHASE7_21] Inotia1 KTF record-length seek-return fix active")' wie_wipi_c/src/api/database.rs; then
            echo 'Legacy per-open Phase7_21 INFO logging is still enabled.' >&2; exit 1
          fi
          grep -n 'PHASE8_40_INOTIA1_WIPE_CLEAR_EVENT_RECOVERY' wie_ktf/src/emulator.rs
          grep -n 'PHASE8_40_INOTIA1_WIPE_CASH_LATCH' wie_wipi_c/src/api/net.rs
          grep -n 'PHASE8_39_ARM_FAULT_CONTEXT' wie_core_arm/src/engine/arm32_cpu.rs
          grep -n 'PHASE8_40_INOTIA1_PRAYER_PURCHASE_HANDOFF' wie_wipi_c/src/api/net.rs
          grep -n 'PHASE8_40_INOTIA1_REVIVAL_CONTEXT_REPAIR' wie_core_arm/src/binary_patches/hook.rs
          grep -n 'kind = "inotia1_revival_base_repair"' data/binary_patches.toml
          grep -n 'pc = 0x00131cb3' data/binary_patches.toml
          grep -n 'hash = "0d7726becf7260f4f0051779bacfdbf1"' data/binary_patches.toml
          grep -n '"version": "0.1.44"' wie_app/tauri.conf.json
          grep -n 'WIPI Player Phase 8.44' PHASE8_44_BUILD_ID.txt
