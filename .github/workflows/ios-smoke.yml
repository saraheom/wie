name: iOS Simulator Smoke Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ios-port
    paths:
      - "wie_app/**"
      - "wie_web/**"
      - "wie_backend/**"
      - "wie_*/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios-smoke.yml"
  pull_request:
    paths:
      - "wie_app/**"
      - "wie_web/**"
      - "wie_backend/**"
      - "wie_*/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios-smoke.yml"

permissions:
  contents: read

concurrency:
  group: ios-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Build unsigned iOS Simulator app
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-apple-ios-sim

      - name: Install Rust build tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack,tauri-cli

      - name: Install frontend dependencies
        run: npm ci

      - name: Build WIE WebAssembly frontend
        run: npm run build:prod

      - name: Install Apple project tools
        run: |
          export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
      
          if ! command -v xcodegen >/dev/null 2>&1; then
            arch -arm64 brew install xcodegen
          fi
      
          if ! command -v idevice_id >/dev/null 2>&1; then
            arch -arm64 brew install libimobiledevice
          fi
      
          command -v xcodegen
          command -v idevice_id
          xcodegen --version
          pod --version

      - name: Generate the Tauri Apple project
        working-directory: wie_app
        run: cargo tauri ios init --ci

      - name: Build unsigned iPhone Simulator app
        working-directory: wie_app/gen/apple
        shell: bash
        run: |
          set -euxo pipefail

          xcodebuild \
            -project wie_app.xcodeproj \
            -scheme wie_app_iOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Package simulator application
        shell: bash
        run: |
          set -euxo pipefail

          APP_PATH="wie_app/gen/apple/build/Build/Products/Debug-iphonesimulator/wie_app_iOS.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Simulator app not found."
            find wie_app/gen/apple/build -name "*.app" || true
            exit 1
          fi

          mkdir -p dist

          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_PATH" \
            dist/WIPI-Player-iOS-Simulator.zip

      - name: Upload simulator build
        uses: actions/upload-artifact@v7
        with:
          name: WIPI-Player-iOS-Simulator
          path: dist/WIPI-Player-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated Apple project on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: WIPI-Player-Apple-Project-Diagnostics
          path: wie_app/gen/apple
          if-no-files-found: ignore
          retention-days: 7
