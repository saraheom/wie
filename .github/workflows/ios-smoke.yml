name: iOS Simulator Smoke Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ios-port
    paths:
      - "wie_app/**"
      - "wie_web/**"
      - "wie_backend/**"
      - "wie_*/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios-smoke.yml"
  pull_request:
    paths:
      - "wie_app/**"
      - "wie_web/**"
      - "wie_backend/**"
      - "wie_*/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios-smoke.yml"

permissions:
  contents: read

concurrency:
  group: ios-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Build unsigned iOS Simulator app
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-apple-ios-sim

      - name: Install Rust build tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack,tauri-cli

      - name: Install frontend dependencies
        run: npm ci

      - name: Build WIE WebAssembly frontend
        run: npm run build:prod

      - name: Install Apple project tools
        run: |
          export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
      
          if ! command -v xcodegen >/dev/null 2>&1; then
            arch -arm64 brew install xcodegen
          fi
      
          if ! command -v idevice_id >/dev/null 2>&1; then
            arch -arm64 brew install libimobiledevice
          fi
      
          command -v xcodegen
          command -v idevice_id
          xcodegen --version
          pod --version

      - name: Generate the Tauri Apple project
        working-directory: wie_app
        run: cargo tauri ios init --ci

      - name: Disable simulator code signing
        working-directory: wie_app/gen/apple
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          project = Path("wie_app.xcodeproj/project.pbxproj")
          text = project.read_text()

          text = text.replace(
              "CODE_SIGN_STYLE = Automatic;",
              "CODE_SIGN_STYLE = Manual;\n"
              "\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n"
              "\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n"
              '\t\t\t\tCODE_SIGN_IDENTITY = "";'
          )

          project.write_text(text)

          print("Updated signing settings:")
          for line in text.splitlines():
              if "CODE_SIGN" in line or "DEVELOPMENT_TEAM" in line:
                  print(line)
          PY

      - name: Build unsigned iPhone Simulator app
        working-directory: wie_app
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: |
          cargo tauri ios build \
            --target aarch64-sim \
            --ci \
            --debug \
            --config '{"build":{"beforeBuildCommand":""}}'

      - name: Package simulator application
        shell: bash
        run: |
          set -euo pipefail

          app_path="$(find wie_app/gen/apple/build \
            -type d \
            -path '*iphonesimulator*' \
            -name '*.app' \
            -print \
            -quit)"

          if [[ -z "$app_path" ]]; then
            echo "No simulator .app bundle was produced."
            find wie_app/gen/apple -maxdepth 8 -type d -name "*.app" -print || true
            exit 1
          fi

          mkdir -p dist

          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            "$app_path" \
            dist/WIPI-Player-iOS-Simulator.zip

          echo "Packaged: $app_path"

      - name: Upload simulator build
        uses: actions/upload-artifact@v7
        with:
          name: WIPI-Player-iOS-Simulator
          path: dist/WIPI-Player-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated Apple project on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: WIPI-Player-Apple-Project-Diagnostics
          path: wie_app/gen/apple
          if-no-files-found: ignore
          retention-days: 7
